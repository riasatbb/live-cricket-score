name: Build Android APK (Control)

on:
  push:
    branches: [main]
    paths:
      - 'control-app/**'
      - '.github/workflows/android-control.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: control-app/package-lock.json

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.11.1

      - name: Install Android platform and build tools
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"

      - name: Install dependencies
        run: cd control-app && npm ci

      - name: Generate app icons and splash
        run: cd control-app && npx @capacitor/assets generate --android

      - name: Sync Capacitor Android project
        run: cd control-app && npx cap sync android

      - name: Build debug APK
        run: cd control-app/android && gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: live-cricket-score-control-apk
          path: control-app/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
